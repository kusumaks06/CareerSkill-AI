{% extends 'base.html' %}

{% block title %}Forgot Password - CareerSkill AI{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-3">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <h2 class="h3 fw-bold text-white">Forgot your password?</h2>
                    <p class="text-secondary small">Enter the email address associated with your CareerSkill AI account.</p>
                </div>

                <form action="{{ url_for('forgot_password') }}" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label text-secondary small fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control bg-dark border-secondary text-white" id="email" name="email" placeholder="name@example.com" required autocomplete="email" value="{{ prefill_email or '' }}">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-brand-primary btn-lg" id="btnSendOtp">
                            <i class="fa-solid fa-paper-plane me-1"></i> Send OTP
                        </button>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}" class="small text-secondary text-decoration-none hover-white">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
